server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy: defence-in-depth against XSS. The key directive is
    # script-src without 'unsafe-inline', which blocks injected <script>/onerror=
    # handlers even if untrusted data ever reaches the DOM as HTML.
    # - *.tile.openstreetmap.org: map tiles
    # - style 'unsafe-inline': Radix UI / Leaflet set inline style attributes
    # - connect-src is left open because the webadmin API base URL is configured
    #   at runtime (env.js) and can live on an arbitrary origin.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src *; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;

    # X-Content-Type-Options: stop browsers from MIME-sniffing a mis-served file
    # into something active (e.g. text rendered as HTML or run as a script).
    add_header X-Content-Type-Options nosniff always;

    # SPA routing — fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache for env.js (runtime config) and index.html
    # NB: a location-level add_header drops headers inherited from the server
    # block, so the CSP and X-Content-Type-Options are re-declared here.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
