# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # wait before proposing a freshly published release, so that hijacked or
    # broken versions get yanked first (security updates are not delayed)
    cooldown:
      default-days: 3
      # our own packages (twake-ui, twake-libs): no need to wait
      exclude:
        - "@linagora/*"
    groups:
      # twake-ui and twake-libs packages (@linagora/twake-mui, -icons,
      # -oidc, ...): one pull request for all of them, majors included
      twake:
        patterns:
          - "@linagora/*"
      # every other dependency: minor and patch updates in one pull request,
      # each major update in its own
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /profile-editor
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
