[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twake-profile-editor"
version = "1.0.0"
description = "Interactive generator for webadmin-proxy allowed.urls profiles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
# Nothing is required to run the tool or its tests. questionary only upgrades
# the interview from numbered prompts to arrow keys and checkboxes.
dependencies = []

[project.optional-dependencies]
interview = ["questionary>=2.0"]


[project.scripts]
twake-profile-editor = "twake_profile_editor.cli:main"

[tool.setuptools.packages.find]
include = ["twake_profile_editor*"]

[tool.setuptools.package-data]
# The webadmin-proxy baseline profiles; the vendor/ directory is long gone, the
# frontend sources being read in place from the repository instead.
twake_profile_editor = ["profiles/*.json"]

# The suite is written against unittest and runs with a bare python3:
#     python3 -m unittest discover -s tests -t .
# pytest collects unittest.TestCase natively, so `python3 -m pytest` also works
# wherever it happens to be installed.
[tool.pytest.ini_options]
testpaths = ["tests"]
