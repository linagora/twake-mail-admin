# Test classes run concurrently against the shared docker stacks; the methods of a class do not.
# A class is the unit of parallelism, which keeps the per test state simple.
#
# How many classes at a time: -De2e.parallelism=<n> on the maven command line, see pom.xml.
# The few classes driving state global to a backend (global quota, the task list, dead letters...)
# take a @ResourceLock, see Locks.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
