mongo.url=mongodb://mongo:27017/esn_docker
mongo.database=esn_docker
domains=open-paas.org
rest.api.port=8080

# Browser facing URLs. They must match the ones exposed in the frontend `.env.js`
# so that generated links (excal, notifications...) are resolvable from the test browser.
spa.calendar.url=http://localhost:8099
spa.contacts.url=http://localhost:8099
spa.excal.url=http://localhost:8099
self.url=http://api
openpaas.backend.url=http://api

dav.url=http://esn_sabre
dav.admin.user=admin
dav.admin.password=secret123
dav.rest.client.trust.all.ssl.certs=false
dav.rest.client.response.timeout=30000
dav.queues.quorum.bypass=false

visio.url=http://meet.e2e.local
openpaas.backend.trust.all.certificates=false

jwt.key.private=file://conf/jwt_privatekey
jwt.key.public=file://conf/jwt_publickey
jwt.key.validity=PT12H

## OIDC: Dex, reachable from this container as http://sso:5556
oidc.userInfo.url=http://sso:5556/userinfo
oidc.introspect.url=http://sso:5556/token/introspect
# Basic base64(tcalendar-side-service:secret123), see oidc/dex_config.yaml
oidc.introspect.credentials=Basic dGNhbGVuZGFyLXNpZGUtc2VydmljZTpzZWNyZXQxMjM=
oidc.introspection.claim=email
oidc.claim=email
# Must match the public client id used by the frontend
oidc.audience=twake-calendar
oidc.token.cache.expiration=300s

calendar.sharing.enabled=true
contacts.sharing.enabled=true
domain.contacts.enabled=true

default.language=en
default.timezone=Europe/Paris
default.business.hours.start=8:0
default.business.hours.end=19:0
default.business.hours.daysOfWeek=1,2,3,4,5,6
default.use.24h.format=true

jwt.technical.token.secret=technicalTokenSecret

## SMTP configuration
smtp.host=mock-smtp
smtp.port=25
smtp.helo=localhost
smtp.ssl.enabled=false
smtp.ssl.trustAllCerts=false
smtp.starttls.enabled=false

mail.template.location=file://root/resources/templates
# The addresses iMIP mail may be sent to. It takes mail addresses, not a domain, so the suite
# uses a fixed pool of outsiders rather than the accounts it creates on the fly: an invitation
# to somebody outside the instance is exactly the case that carries a link to the public pages.
# mail.imip.recipient.whitelist omitted: the documentation says it then allows everyone
mail.sender=no-reply@openpaas.org

## Kept enabled: lets the tests seed / assert backend state without going through OIDC
basic.auth.enabled=true
admin.username=admin@open-paas.org
admin.password=secret
